
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <meta name="theme-color" content="#f4f6f1" media="(prefers-color-scheme: light)" />
      <meta name="theme-color" content="#16271e" media="(prefers-color-scheme: dark)" />
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-title" content="PicklePro" />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700;800&display=swap" />
      <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
      <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
      <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
      <link rel="manifest" href="/manifest.webmanifest" />
      <title>PicklePro</title>
      <meta name="description" content="Rate your pickleball game or analyze a video, then get focus areas, drills and a practice plan." />
      <meta name="robots" content="noindex, nofollow" />
      <script>
        // Apply the saved appearance before first paint so the page never flashes the wrong theme.
        try { var t = localStorage.getItem("picklepro:theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
      </script>
      <style>html, body { height: 100%; margin: 0; background: #f4f6f1; } #root { height: 100%; }
        @media (prefers-color-scheme: dark) { html:not([data-theme="light"]), html:not([data-theme="light"]) body { background: #16271e; } }
        html[data-theme="dark"], html[data-theme="dark"] body { background: #16271e; }</style>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
